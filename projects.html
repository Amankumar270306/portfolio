<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Curated Works - Projects" />
    <title>Projects | AMAN</title>
  </head>
  <body>
    <main>
      
      <section class="container" style="padding-top: 4rem; text-align: center;">
        <h1 class="animate-fade-up">Curated Works</h1>
        <p class="animate-fade-up delay-100" style="max-width: 600px; margin: 0 auto 6rem auto;">
          A selection of high-end digital experiences, architectural visualizations, and brand identities crafted with precision and intentionality.
        </p>
        
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; text-align: left;">
          
          <a href="#" class="project-card animate-fade-up delay-100">
            <img src="/project_glass_1777910852845.png" alt="The Glass Pavilion" />
            <h2 class="project-card-title">The Glass Pavilion</h2>
          </a>

        </div>

        <div style="margin-top: 6rem;" class="animate-fade-up delay-200">
          <a href="#" class="btn btn-outline" style="color: white; border-color: var(--border-dark);">Load More Works</a>
        </div>
      </section>

    </main>

    
    <footer style="background: var(--bg-dark); color: var(--text-muted); padding: 3rem 0; border-top: 1px solid var(--border-dark); margin-top: 6rem;">
      <div class="container" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;">
        <div class="logo">AMAN</div>
        <p class="text-small-caps" style="margin: 0;">&copy; 2026 The Discerning Curator. All Rights Reserved.</p>
        <div style="display: flex; gap: 1.5rem;" class="text-small-caps">
          <a href="#" style="color: inherit; text-decoration: none;">LinkedIn</a>
          <a href="#" style="color: inherit; text-decoration: none;">Instagram</a>
          <a href="#" style="color: inherit; text-decoration: none;">Dribbble</a>
        </div>
      </div>

    <script type="module" src="/src/main.ts"></script>
